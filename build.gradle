// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = '2.4.21'
    ext.library_version = '1.0.12'

    repositories {
        mavenLocal()
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "de.undercouch:gradle-download-task:5.7.0"
    }
}

allprojects {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = 'https://jitpack.io' }
        google()
    }

    version = rootProject.ext.library_version
    group = 'com.github.richard-muvirimi'
}

// Make library module the default for JitPack
if (System.getenv("JITPACK")) {
    // Publish all module publications to Maven Local so JitPack can serve them
    defaultTasks 'publishToMavenLocal'
}

tasks.register('clean', Delete) {
    delete layout.buildDirectory
}
