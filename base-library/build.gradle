plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'com.android.timezonepicker'
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 17
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    sourceSets {
        main.java.srcDirs += 'src/main/src'
    }

    // Configure lint to avoid blocking JitPack builds
    lint {
        abortOnError false
        checkReleaseBuilds false
        ignoreWarnings true

        // Disable specific lint checks that are causing issues
        disable 'LongLogTag'
        targetSdk = 36
    }

    // Publish only the release variant and include sources jar
    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
    testOptions {
        targetSdk = 36
    }
}

dependencies {
    api 'androidx.appcompat:appcompat:1.7.1'
}

publishing {
    publications {
        maven(MavenPublication) {
            // Use the module name as artifactId so dependency coordinates match
            artifactId = project.name
            version = project.version
            // Defer component selection until after evaluation
            afterEvaluate {
                from components.release
            }
        }
    }
}
