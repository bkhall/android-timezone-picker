import de.undercouch.gradle.tasks.download.Download
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.library'
    id "de.undercouch.download"
    id 'maven-publish'
}

android {
    namespace = 'com.tyganeutronics.timezonepicker'
    compileSdk = 37

    defaultConfig {
        minSdk = 26

        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
    lint {
        targetSdk = 37
    }
    testOptions {
        targetSdk = 37
    }
}

kotlin {
    // Keep the published kotlin-stdlib version independent of the compiler version, so apps
    // using older Kotlin compilers can still consume this library.
    coreLibrariesVersion = '2.2.20'

    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
    }
}

dependencies {
    api 'androidx.appcompat:appcompat:1.8.0'
    api 'com.google.android.material:material:1.14.0'
    api 'androidx.core:core-ktx:1.19.1'
}

// Download timezone data files when the task runs, not while Gradle configures the project
def downloadTimeZoneData = tasks.register('downloadTimeZoneData', Download) {
    src([
            'https://raw.githubusercontent.com/eggert/tz/main/backward',
            'https://raw.githubusercontent.com/eggert/tz/main/zone.tab'
    ])

    dest layout.projectDirectory.dir('src/main/assets')
    onlyIfModified true
    useETag 'all'
}

tasks.named('preBuild') {
    dependsOn downloadTimeZoneData
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'com.github.richard-muvirimi'
            artifactId = 'android-timezone-picker'
            version = project.version

            afterEvaluate {
                from components.release
            }
        }
    }
}
