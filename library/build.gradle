plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id "de.undercouch.download"
    id 'maven-publish'
}

android {
    namespace 'com.tyganeutronics.timezonepicker'
    compileSdkVersion 36

    defaultConfig {
        minSdk 26

        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_21
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
    lint {
        targetSdk 36
    }
    testOptions {
        targetSdk 36
    }
}

dependencies {
    api project(path: ':base-library')

    api 'androidx.core:core-ktx:1.17.0'
}

tasks.register('downloadTimeZoneData') {
    // Download timezone data files
    download.run {
        src([
                'https://raw.githubusercontent.com/eggert/tz/main/backward',
                'https://raw.githubusercontent.com/eggert/tz/main/zone.tab'
        ])

        // Use a project-relative path to avoid Windows absolute path issues
        dest new File(project.projectDir, 'src/main/assets')
        onlyIfModified true
        useETag 'all'
    }
}

preBuild.dependsOn downloadTimeZoneData

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'com.github.richard-muvirimi'
            artifactId = 'android-timezone-picker'
            version = project.version

            afterEvaluate {
                from components.release
            }
        }
    }
}
